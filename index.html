<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Pemakaian Material</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root{--bg:#08090e;--card:#131620;--border:rgba(255,255,255,.06);--fg:#e4e6ea;--muted:#5c6370;--accent:#e8930c;--green:#2dd4a0;--red:#f06070}
  *{box-sizing:border-box;margin:0;padding:0}body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--fg);line-height:1.5}
  .wrap{max-width:1400px;margin:0 auto;padding:20px}
  h1{font-size:24px;font-weight:800;margin-bottom:20px;display:flex;align-items:center;gap:10px}
  .cd{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px}
  .btn{padding:10px 20px;border-radius:8px;font-weight:700;cursor:pointer;border:none;font-family:inherit;background:var(--accent);color:#000;transition:.2s}
  .btn:hover{opacity:.85}
  .btn-outline{background:transparent;border:1px solid var(--border);color:var(--fg)}
  
  /* Tabel */
  .tbl-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--border)}
  table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}
  th{background:rgba(255,255,255,.03);padding:12px;text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border)}
  td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.03)}
  img.thumb{width:60px;height:40px;object-fit:cover;border-radius:4px;cursor:pointer;border:1px solid var(--border);transition:.2s}
  img.thumb:hover{transform:scale(1.5);z-index:10;position:relative;box-shadow:0 4px 15px rgba(0,0,0,.5)}
  
  /* Form */
  .form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:15px}
  .fg{margin-bottom:15px}
  label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:5px}
  input, select{width:100%;padding:10px 12px;border-radius:8px;background:rgba(255,255,255,.03);border:1px solid var(--border);color:var(--fg);font-family:inherit;font-size:13px}
  input:focus{outline:none;border-color:var(--accent)}
  input[type="file"]{padding:7px}
  .foto-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
  .foto-item{position:relative}
  .foto-item img{width:100%;height:80px;object-fit:cover;border-radius:6px;border:1px solid var(--border);display:none}
  
  .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;align-items:center;justify-content:center}
  .modal.active{display:flex}
  .modal img{max-width:90%;max-height:90%;border-radius:8px}
</style>
</head>
<body>

<div class="wrap">
  <h1><i class="fas fa-boxes-stacked" style="color:var(--accent)"></i> Pemakaian Material</h1>
  
  <div style="display:flex;gap:10px;margin-bottom:20px">
    <button class="btn" onclick="toggleForm()"><i class="fas fa-plus"></i> Tambah Laporan</button>
  </div>

  <!-- Form Section -->
  <div id="formSection" class="cd" style="display:none">
    <h2 style="font-size:18px;font-weight:700;margin-bottom:15px">Form Laporan Material</h2>
    <form id="materialForm" onsubmit="submitData(event)">
      <div class="form-grid">
        <div class="fg"><label>Nama Team</label><input type="text" id="namaTeam" required></div>
        <div class="fg"><label>PIC</label><input type="text" id="pic" required></div>
        <div class="fg"><label>Tanggal</label><input type="date" id="tanggal" required></div>
        <div class="fg"><label>Jenis Barang</label><input type="text" id="jenisBarang" required></div>
        <div class="fg"><label>Banyak nya</label><input type="number" id="banyakNya" required></div>
        <div class="fg"><label>Peruntukan</label><input type="text" id="peruntukan" required></div>
      </div>
      
      <div style="margin-top:20px; border-top:1px solid var(--border); padding-top:15px">
        <label style="font-size:14px; color:var(--accent)"><i class="fas fa-camera"></i> Foto Pengambilan</label>
        <input type="file" id="fotoPengambilan" accept="image/*" required onchange="previewImg(this, 'prevPengambilan')">
        <img id="prevPengambilan" class="thumb" style="margin-top:5px; display:none">
      </div>

      <div style="margin-top:20px; border-top:1px solid var(--border); padding-top:15px">
        <label style="font-size:14px; color:var(--green)"><i class="fas fa-images"></i> Foto Pemakaian Barang (1-21)</label>
        <div class="foto-grid" id="pemakaianFotoGrid">
          <!-- Akan diisi oleh JS -->
        </div>
      </div>

      <button type="submit" class="btn" style="margin-top:20px; width:100%; padding:12px; font-size:14px" id="submitBtn">
        <i class="fas fa-paper-plane"></i> Simpan Laporan
      </button>
    </form>
  </div>

  <!-- Table Section -->
  <div class="cd">
    <div class="tbl-wrap">
      <table>
        <thead>
          <tr>
            <th>Tanggal</th>
            <th>Team</th>
            <th>PIC</th>
            <th>Barang</th>
            <th>Jml</th>
            <th>Peruntukan</th>
            <th>F. Ambil</th>
            <th>F. Pakai 1</th><th>F. Pakai 2</th><th>F. Pakai 3</th><th>F. Pakai 4</th><th>F. Pakai 5</th>
            <th>...</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="13" style="text-align:center;color:var(--muted)">Memuat data...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal Preview Foto -->
<div class="modal" id="imgModal" onclick="this.classList.remove('active')">
  <img src="" id="modalImg">
</div>

<script>
  const SCRIPT_URL = 'MASUKKAN_URL_WEB_APP_SCRIPT_ANDA_DISINI';
  
  // Inisialisasi 21 slot foto pemakaian
  const fotoGrid = document.getElementById('pemakaianFotoGrid');
  for(let i=1; i<=21; i++){
    const div = document.createElement('div');
    div.className = 'foto-item';
    div.innerHTML = `
      <label style="font-size:9px">Foto ${i}</label>
      <input type="file" id="fotoPakai${i}" accept="image/*" onchange="previewImg(this, 'prevPakai${i}')">
      <img id="prevPakai${i}" class="thumb" style="display:none; width:100%; height:80px; margin-top:5px">
    `;
    fotoGrid.appendChild(div);
  }

  function toggleForm() {
    const form = document.getElementById('formSection');
    form.style.display = form.style.display === 'none' ? 'block' : 'none';
  }

  function previewImg(input, previewId) {
    if (input.files && input.files[0]) {
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById(previewId).src = e.target.result;
        document.getElementById(previewId).style.display = 'block';
      }
      reader.readAsDataURL(input.files[0]);
    }
  }

  function openModal(src) {
    document.getElementById('modalImg').src = src;
    document.getElementById('imgModal').classList.add('active');
  }

  // Convert File to Base64
  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      if (!file) resolve("");
      const reader = new FileReader();
      reader.onload = () => {
        // Hapus header "data:image/jpeg;base64," untuk dikirim ke Apps Script
        const base64 = reader.result.split(',')[1];
        resolve(base64);
      };
      reader.onerror = error => reject(error);
      reader.readAsDataURL(file);
    });
  }

  async function submitData(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mengupload foto ke Drive...';

    try {
      // Kumpulkan data teks
      const payload = {
        namaTeam: document.getElementById('namaTeam').value,
        pic: document.getElementById('pic').value,
        tanggal: document.getElementById('tanggal').value,
        jenisBarang: document.getElementById('jenisBarang').value,
        banyakNya: document.getElementById('banyakNya').value,
        peruntukan: document.getElementById('peruntukan').value
      };

      // Konversi Foto Pengambilan
      const filePengambilan = document.getElementById('fotoPengambilan').files[0];
      payload.fotoPengambilanBase64 = await fileToBase64(filePengambilan);

      // Konversi 21 Foto Pemakaian
      for(let i=1; i<=21; i++){
        const fileInput = document.getElementById(`fotoPakai${i}`).files[0];
        payload[`fotoPemakaianBase64_${i}`] = await fileToBase64(fileInput);
      }

      // Kirim ke Apps Script
      const response = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      const result = await response.json();

      if(result.status === 'success') {
        alert('Laporan berhasil disimpan!');
        document.getElementById('materialForm').reset();
        // Sembunyikan preview
        document.querySelectorAll('.thumb').forEach(el => el.style.display = 'none');
        toggleForm();
        loadData();
      } else {
        throw new Error(result.message);
      }
    } catch (error) {
      alert('Gagal menyimpan: ' + error.message);
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-paper-plane"></i> Simpan Laporan';
    }
  }

  async function loadData() {
    try {
      const response = await fetch(SCRIPT_URL);
      const data = await response.json();
      const tbody = document.getElementById('tableBody');
      
      if(data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="13" style="text-align:center;color:var(--muted)">Belum ada data</td></tr>';
        return;
      }

      tbody.innerHTML = '';
      data.reverse().forEach(row => {
        const tr = document.createElement('tr');
        
        // Kolom Teks
        tr.innerHTML = `
          <td>${row.tanggal}</td>
          <td><b>${row.namaTeam}</b></td>
          <td>${row.pic}</td>
          <td>${row.jenisBarang}</td>
          <td>${row.banyakNya}</td>
          <td>${row.peruntukan}</td>
          <td>${row.fotoPengambilan ? `<img src="${row.fotoPengambilan}" class="thumb" onclick="openModal(this.src)">` : '-'}</td>
        `;

        // Kolom 21 Foto Pemakaian (Hanya tampilkan 5 di tabel utama, sisanya bisa di scroll atau dibuat detail page)
        // Di sini saya tampilkan 5 pertama untuk menghemat space tabel, tapi datanya tetap masuk sheet 21 kolom
        for(let i=0; i<5; i++) {
          const url = row.fotoPemakaian[i];
          tr.innerHTML += `<td>${url ? `<img src="${url}" class="thumb" onclick="openModal(this.src)">` : '-'}</td>`;
        }
        
        tbody.appendChild(tr);
      });
    } catch (error) {
      console.error('Error loading data:', error);
    }
  }

  // Panggil saat pertama kali load
  loadData();
</script>
</body>
</html>
