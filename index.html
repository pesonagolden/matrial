<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Pemakaian Material</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root{--bg:#08090e;--card:#131620;--border:rgba(255,255,255,.06);--fg:#e4e6ea;--muted:#5c6370;--accent:#e8930c;--green:#2dd4a0;--red:#f06070;--blue:#3b82f6}
  *{box-sizing:border-box;margin:0;padding:0}body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--fg);line-height:1.5}
  .wrap{max-width:1400px;margin:0 auto;padding:20px}
  h1{font-size:24px;font-weight:800;margin-bottom:20px;display:flex;align-items:center;gap:10px}
  .cd{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px}
  .btn{padding:10px 20px;border-radius:8px;font-weight:700;cursor:pointer;border:none;font-family:inherit;background:var(--accent);color:#000;transition:.2s; font-size:12px}
  .btn:hover{opacity:.85}
  .btn-sm{padding:5px 10px; font-size:11px; border-radius:6px}
  .btn-blue{background:var(--blue); color:#fff}
  .tbl-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--border)}
  table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}
  th{background:rgba(255,255,255,.03);padding:12px;text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border)}
  td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.03)}
  img.thumb{width:60px;height:40px;object-fit:cover;border-radius:4px;cursor:pointer;border:1px solid var(--border);transition:.2s}
  img.thumb:hover{transform:scale(1.5);z-index:10;position:relative;box-shadow:0 4px 15px rgba(0,0,0,.5)}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:15px}
  .fg{margin-bottom:15px}
  label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:5px}
  input, select{width:100%;padding:10px 12px;border-radius:8px;background:rgba(255,255,255,.03);border:1px solid var(--border);color:var(--fg);font-family:inherit;font-size:13px}
  input:focus, select:focus{outline:none;border-color:var(--accent)}
  input[type="file"]{padding:7px}
  select option{background:#191d2b;color:var(--fg)}
  .foto-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
  .info-edit{font-size:10px; color:var(--green); margin-top:2px;}
  .upload-status{display:none; color:var(--green); font-size:10px; margin-top:4px; font-weight:600; align-items:center; gap:4px}
  .upload-status.active{display:flex}
  .existing-gallery-wrap{background:rgba(255,255,255,.02); border:1px dashed var(--border); border-radius:8px; padding:12px; margin-bottom:15px; display:none;}
  .existing-gallery-wrap.active{display:block}
  .gallery-thumb{width:50px; height:50px; object-fit:cover; border-radius:6px; cursor:pointer; border:2px solid var(--border); transition:.2s}
  .gallery-thumb:hover{transform:scale(1.1); border-color:var(--green); box-shadow:0 2px 10px rgba(0,0,0,.5)}
  .foto-cell{display:flex;flex-direction:column;align-items:center;gap:4px}
  .drive-link{color:var(--blue);font-size:10px;text-decoration:none;display:flex;align-items:center;gap:3px}
  .drive-link:hover{color:#60a5fa; text-decoration:underline}
  
  /* CSS Fallback jika foto gagal dimuat */
  .fallback-img{width:60px; height:40px; display:none; align-items:center; justify-content:center; border:1px solid var(--border); border-radius:4px; background:rgba(255,255,255,.03); color:var(--muted); font-size:12px;}
  
  .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;align-items:center;justify-content:center;flex-direction:column}
  .modal.active{display:flex}
  .modal img{max-width:90%;max-height:80%;border-radius:8px; box-shadow:0 4px 20px rgba(0,0,0,.5)}
  .modal-actions{margin-top:15px; display:flex; gap:10px}
  .btn-modal{padding:8px 16px; border-radius:6px; text-decoration:none; font-size:12px; font-weight:700; border:none; cursor:pointer; font-family:inherit}
  .btn-drive{background:var(--blue); color:#fff}
  .btn-close{background:var(--red); color:#fff}
</style>
</head>
<body>

<div class="wrap">
  <h1><i class="fas fa-boxes-stacked" style="color:var(--accent)"></i> Pemakaian Material</h1>
  <div style="display:flex;gap:10px;margin-bottom:20px">
    <button class="btn" onclick="openNewForm()"><i class="fas fa-plus"></i> Tambah Laporan</button>
  </div>

  <div id="formSection" class="cd" style="display:none">
    <h2 id="formTitle" style="font-size:18px;font-weight:700;margin-bottom:15px">Form Laporan Material</h2>
    <form id="materialForm" onsubmit="submitData(event)">
      <input type="hidden" id="rowNum">
      <div class="form-grid">
        <div class="fg">
          <label>Nama Team</label>
          <select id="namaTeam" required>
            <option value="">-- Pilih Team --</option>
            <option value="APCSD">APCSD</option>
            <option value="FTTX">FTTX</option>
            <option value="COREMAN">COREMAN</option>
            <option value="PROJECT">PROJECT</option>
          </select>
        </div>
        <div class="fg"><label>PIC</label><input type="text" id="pic" required></div>
        <div class="fg"><label>Tanggal</label><input type="date" id="tanggal" required></div>
        <div class="fg">
          <label>Jenis Barang</label>
          <select id="jenisBarang" required>
            <option value="">-- Pilih Jenis Barang --</option>
            <option value="JC 96">JC 96</option>
            <option value="OTB UPC 96">OTB UPC 96</option>
            <option value="OTB APC 96">OTB APC 96</option>
            <option value="OTB 24">OTB 24</option>
            <option value="PATCHSCORE SC-LC">PATCHSCORE SC-LC</option>
            <option value="PATCHSCORE FC-LC">PATCHSCORE FC-LC</option>
            <option value="BAREL UPC">BAREL UPC</option>
            <option value="BAREL">BAREL</option>
            <option value="APC">APC</option>
            <option value="SFP 1G">SFP 1G</option>
            <option value="SFP 10G">SFP 10G</option>
            <option value="SFP 100G">SFP 100G</option>
            <option value="BIDI 10G">BIDI 10G</option>
            <option value="BIDI 100G">BIDI 100G</option>
            <option value="BIDI 1G">BIDI 1G</option>
          </select>
        </div>
        <div class="fg"><label>Banyak nya</label><input type="number" id="banyakNya" required></div>
        <div class="fg"><label>Peruntukan</label><input type="text" id="peruntukan" required></div>
      </div>
      
      <div style="margin-top:20px; border-top:1px solid var(--border); padding-top:15px">
        <label style="font-size:14px; color:var(--accent)"><i class="fas fa-camera"></i> Foto Pengambilan</label>
        <div id="existingAmbilWrap" class="existing-gallery-wrap">
          <label style="font-size:10px; margin-bottom:8px; display:block; color:var(--green)"><i class="fas fa-check-circle"></i> Foto lama sudah ada (Klik untuk lihat):</label>
          <div id="existingAmbilGallery" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
        </div>
        <input type="file" id="fotoPengambilan" accept="image/*" onchange="previewImg(this, 'prevPengambilan', 'statusPengambilan')">
        <img id="prevPengambilan" class="thumb" referrerpolicy="no-referrer" style="margin-top:5px; display:none">
        <div id="statusPengambilan" class="upload-status"><i class="fas fa-check-circle"></i> Sudah upload (Tidak perlu upload ulang)</div>
      </div>

      <div style="margin-top:20px; border-top:1px solid var(--border); padding-top:15px">
        <label style="font-size:14px; color:var(--green)"><i class="fas fa-images"></i> Foto Pemakaian Barang (1-21)</label>
        <div id="existingPakaiWrap" class="existing-gallery-wrap">
          <label style="font-size:10px; margin-bottom:8px; display:block; color:var(--green)"><i class="fas fa-check-circle"></i> Foto lama sudah ada (Klik thumbnail untuk lihat):</label>
          <div id="existingPakaiGallery" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
        </div>
        <div class="info-edit">* Kosongkan jika tidak ingin mengubah foto lama</div>
        <div class="foto-grid" id="pemakaianFotoGrid"></div>
      </div>

      <button type="submit" class="btn" style="margin-top:20px; width:100%; padding:12px; font-size:14px" id="submitBtn">
        <i class="fas fa-paper-plane"></i> Simpan Laporan
      </button>
    </form>
  </div>

  <div class="cd">
    <div class="tbl-wrap">
      <table>
        <thead>
          <tr>
            <th>Aksi</th>
            <th>Tanggal</th><th>Team</th><th>PIC</th><th>Barang</th><th>Jml</th><th>Peruntukan</th><th>F. Ambil</th>
            <th>F. Pakai 1</th><th>F. Pakai 2</th><th>F. Pakai 3</th><th>F. Pakai 4</th><th>F. Pakai 5</th><th>...</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="14" style="text-align:center;color:var(--muted)"><i class="fas fa-spinner fa-spin"></i> Memuat data...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal" id="imgModal" onclick="closeModal(event)">
  <img src="" id="modalImg" referrerpolicy="no-referrer" onclick="event.stopPropagation()">
  <div class="modal-actions" onclick="event.stopPropagation()">
    <a href="#" id="modalDriveLink" target="_blank" class="btn-modal btn-drive"><i class="fas fa-external-link-alt"></i> Buka di Drive</a>
    <button onclick="document.getElementById('imgModal').classList.remove('active')" class="btn-modal btn-close"><i class="fas fa-times"></i> Tutup</button>
  </div>
</div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwws5N1VrzreQz0Frcimh1MV1IzO4Gcv5oieIqZTKU-XfvplBQ_kuYCAN7YkhHiVfqB/exec';
  let globalData = [];
  
  const fotoGrid = document.getElementById('pemakaianFotoGrid');
  for(let i=1; i<=21; i++){
    const div = document.createElement('div');
    div.className = 'foto-item';
    div.innerHTML = `
      <label style="font-size:9px">Foto ${i}</label>
      <input type="file" id="fotoPakai${i}" accept="image/*" onchange="previewImg(this, 'prevPakai${i}', 'statusPakai${i}')">
      <img id="prevPakai${i}" class="thumb" referrerpolicy="no-referrer" style="display:none; width:100%; height:80px; margin-top:5px">
      <div id="statusPakai${i}" class="upload-status"><i class="fas fa-check-circle"></i> Sudah upload</div>
    `;
    fotoGrid.appendChild(div);
  }

  // FUNGSI PENCARI ID YANG SANGAT ROBUST (Bisa membaca hampir semua format link Drive)
  function getFileId(url) {
    if (!url || typeof url !== 'string') return null;
    let match = url.match(/\/d\/([a-zA-Z0-9_-]+)/); // Format /d/ID
    if (match) return match[1];
    match = url.match(/[?&]id=([a-zA-Z0-9_-]+)/); // Format ?id=ID
    if (match) return match[1];
    return null;
  }

  function openNewForm() {
    document.getElementById('materialForm').reset();
    document.getElementById('rowNum').value = "";
    document.querySelectorAll('.thumb').forEach(el => el.style.display = 'none');
    document.querySelectorAll('.upload-status').forEach(el => el.classList.remove('active'));
    document.getElementById('existingAmbilWrap').classList.remove('active');
    document.getElementById('existingPakaiWrap').classList.remove('active');
    document.getElementById('formTitle').innerText = "Form Laporan Baru";
    document.getElementById('submitBtn').innerHTML = '<i class="fas fa-paper-plane"></i> Simpan Laporan';
    const form = document.getElementById('formSection');
    form.style.display = form.style.display === 'none' ? 'block' : 'none';
  }

  function previewImg(input, previewId, statusId) {
    if (input.files && input.files[0]) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const prev = document.getElementById(previewId);
        prev.src = e.target.result;
        prev.style.display = 'block';
        if(statusId) document.getElementById(statusId).classList.remove('active');
      }
      reader.readAsDataURL(input.files[0]);
    }
  }

  function openModal(src, driveUrl) {
    document.getElementById('modalImg').src = src;
    document.getElementById('modalDriveLink').href = driveUrl;
    document.getElementById('imgModal').classList.add('active');
  }

  function closeModal(event) {
    if(event.target === document.getElementById('imgModal')) {
       document.getElementById('imgModal').classList.remove('active');
    }
  }

  function compressImage(file) {
    return new Promise((resolve) => {
      if (!file) { resolve(""); return; }
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 800;
          let width = img.width;
          let height = img.height;
          if (width > MAX_WIDTH) { height = Math.round((height *= MAX_WIDTH / width)); width = MAX_WIDTH; }
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.5); 
          resolve(dataUrl.split(',')[1]);
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function editRow(index) {
    const row = globalData[index];
    if(!row) return;
    document.getElementById('formSection').style.display = 'block';
    document.getElementById('formTitle').innerText = "Edit Laporan";
    document.getElementById('submitBtn').innerHTML = '<i class="fas fa-save"></i> Update Laporan';
    
    document.getElementById('rowNum').value = row.rowNum;
    document.getElementById('namaTeam').value = row.namaTeam;
    document.getElementById('pic').value = row.pic;
    
    if(row.tanggal) {
      let parts = row.tanggal.split('/');
      document.getElementById('tanggal').value = parts[2] + '-' + parts[1] + '-' + parts[0];
    }

    document.getElementById('jenisBarang').value = row.jenisBarang;
    document.getElementById('banyakNya').value = row.banyakNya;
    document.getElementById('peruntukan').value = row.peruntukan;

    const ambilWrap = document.getElementById('existingAmbilWrap');
    const ambilGallery = document.getElementById('existingAmbilGallery');
    ambilGallery.innerHTML = ''; 
    document.getElementById('prevPengambilan').style.display = 'none'; 
    
    const fileIdAmbil = getFileId(row.fotoPengambilan);
    if(fileIdAmbil) { 
      ambilWrap.classList.add('active');
      const imgSrc = `https://lh3.googleusercontent.com/d/${fileIdAmbil}=s800`;
      const driveUrl = `https://drive.google.com/file/d/${fileIdAmbil}/view?usp=sharing`;
      const img = document.createElement('img');
      img.src = imgSrc;
      img.className = 'gallery-thumb';
      img.referrerpolicy = 'no-referrer';
      img.onclick = () => openModal(imgSrc, driveUrl);
      ambilGallery.appendChild(img);
    } else { 
      ambilWrap.classList.remove('active'); 
    }

    const pakaiWrap = document.getElementById('existingPakaiWrap');
    const pakaiGallery = document.getElementById('existingPakaiGallery');
    pakaiGallery.innerHTML = ''; 
    
    let hasExistingPakai = false;
    for(let i=1; i<=21; i++){
      const url = row.fotoPemakaian ? row.fotoPemakaian[i-1] : null;
      document.getElementById(`prevPakai${i}`).style.display = 'none';
      document.getElementById(`statusPakai${i}`).classList.remove('active');

      const fileIdPakai = getFileId(url);
      if(fileIdPakai) { 
        hasExistingPakai = true;
        const imgSrc = `https://lh3.googleusercontent.com/d/${fileIdPakai}=s800`;
        const driveUrl = `https://drive.google.com/file/d/${fileIdPakai}/view?usp=sharing`;
        const img = document.createElement('img');
        img.src = imgSrc;
        img.className = 'gallery-thumb';
        img.referrerpolicy = 'no-referrer';
        img.onclick = () => openModal(imgSrc, driveUrl);
        pakaiGallery.appendChild(img);
      }
    }
    
    if(hasExistingPakai) pakaiWrap.classList.add('active');
    else pakaiWrap.classList.remove('active');

    document.getElementById('fotoPengambilan').value = '';
    for(let i=1; i<=21; i++) document.getElementById(`fotoPakai${i}`).value = '';
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  async function submitData(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memproses...';
    try {
      const payload = {
        rowNum: document.getElementById('rowNum').value,
        namaTeam: document.getElementById('namaTeam').value,
        pic: document.getElementById('pic').value,
        tanggal: document.getElementById('tanggal').value,
        jenisBarang: document.getElementById('jenisBarang').value,
        banyakNya: document.getElementById('banyakNya').value,
        peruntukan: document.getElementById('peruntukan').value
      };
      
      const filePengambilan = document.getElementById('fotoPengambilan').files[0];
      payload.fotoPengambilanBase64 = await compressImage(filePengambilan);

      for(let i=1; i<=21; i++){
        const fileInput = document.getElementById(`fotoPakai${i}`).files[0];
        payload[`fotoPemakaianBase64_${i}`] = await compressImage(fileInput);
      }

      const response = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload)
      });
      const result = await response.json();

      if(result.status === 'success') {
        alert(payload.rowNum ? 'Laporan berhasil diupdate!' : 'Laporan berhasil disimpan!');
        document.getElementById('materialForm').reset();
        document.querySelectorAll('.thumb').forEach(el => el.style.display = 'none');
        document.querySelectorAll('.upload-status').forEach(el => el.classList.remove('active'));
        document.getElementById('existingAmbilWrap').classList.remove('active');
        document.getElementById('existingPakaiWrap').classList.remove('active');
        document.getElementById('formSection').style.display = 'none';
        loadData();
      } else { throw new Error(result.message || 'Gagal menyimpan ke server'); }
    } catch (error) { alert('Error: ' + error.message); } 
    finally { btn.disabled = false; btn.innerHTML = '<i class="fas fa-save"></i> Simpan'; }
  }

  // FUNGSI UNTUK MERENDER THUMBNAIL DI TABEL DENGAN AMAN
  function renderFotoCell(url) {
    const fileId = getFileId(url);
    if (fileId) {
      const imgSrc = `https://lh3.googleusercontent.com/d/${fileId}=s800`; // Rekonstruksi URL pasti benar
      const driveUrl = `https://drive.google.com/file/d/${fileId}/view?usp=sharing`;
      return `
        <td>
          <div class="foto-cell">
            <img src="${imgSrc}" class="thumb" referrerpolicy="no-referrer" 
                 onclick="openModal(this.src, '${driveUrl}')" 
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <div class="fallback-img"><i class="fas fa-unlink"></i></div>
            <a href="${driveUrl}" target="_blank" class="drive-link"><i class="fas fa-link"></i> Drive</a>
          </div>
        </td>`;
    }
    return '<td>-</td>'; // Jika tidak ada ID ditemukan, tetap tampilkan strip
  }

  async function loadData() {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '<tr><td colspan="14" style="text-align:center;color:var(--muted)"><i class="fas fa-spinner fa-spin"></i> Memuat data...</td></tr>';
    try {
      const response = await fetch(SCRIPT_URL + '?action=load');
      if (!response.ok) throw new Error('Gagal mengambil data');
      const data = await response.json();
      globalData = data;
      
      if(data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="14" style="text-align:center;color:var(--muted)">Belum ada data laporan</td></tr>';
        return;
      }

      tbody.innerHTML = '';
      data.reverse().forEach((row, index) => {
        const tr = document.createElement('tr');
        let actionHtml = `<button class="btn btn-sm btn-blue" onclick="editRow(${index})"><i class="fas fa-edit"></i> Edit</button>`;

        tr.innerHTML = `
          <td>${actionHtml}</td>
          <td>${row.tanggal || '-'}</td>
          <td><b>${row.namaTeam || '-'}</b></td>
          <td>${row.pic || '-'}</td>
          <td>${row.jenisBarang || '-'}</td>
          <td>${row.banyakNya || '-'}</td>
          <td>${row.peruntukan || '-'}</td>
          ${renderFotoCell(row.fotoPengambilan)}
        `;

        for(let i=0; i<5; i++) {
          const url = row.fotoPemakaian ? row.fotoPemakaian[i] : null;
          tr.innerHTML += renderFotoCell(url);
        }
        
        tbody.appendChild(tr);
      });
    } catch (error) {
      console.error('Load Error:', error);
      tbody.innerHTML = `<tr><td colspan="14" style="text-align:center;color:var(--red)"><b>Gagal Memuat Data</b></td></tr>`;
    }
  }

  loadData();
</script>
</body>
</html>
